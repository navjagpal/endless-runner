<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Runner</title>
    <link rel="preload" href="%BASE_URL%fonts/Fredoka.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      /* Fredoka (SIL OFL 1.1, see public/fonts/OFL.txt) — a rounded, friendly
         face so the HUD and menus stop depending on whatever the device has. */
      @font-face {
        font-family: 'Fredoka';
        src: url('%BASE_URL%fonts/Fredoka.ttf') format('truetype');
        font-weight: 300 700;
        font-display: swap;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
